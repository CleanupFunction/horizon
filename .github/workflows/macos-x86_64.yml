name: Build macOS x86_64 Application

on:
  workflow_dispatch:
    inputs:
      build_game:
        description: 'Also build the game client binaries (horizon-client, horizon-ctl, etc.)'
        type: boolean
        default: true
  push:
    branches:
      - main
      - feat/macos-x64*
      - macos-x86_64*
    paths:
      - 'launcher/**'
      - 'packaging/macos/**'
      - '.github/workflows/macos-x86_64.yml'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'launcher/**'
      - 'packaging/macos/**'
      - '.github/workflows/macos-x86_64.yml'

permissions:
  contents: write

concurrency:
  group: macos-x86_64-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-launcher:
    name: Build Horizon Launcher (macOS x86_64)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: launcher-macos-x86_64

      - name: Setup Python & dmgbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg"
          "$RUNNER_TEMP/dmg/bin/pip" install --quiet dmgbuild==1.6.5
          echo "$RUNNER_TEMP/dmg/bin" >> "$GITHUB_PATH"

      - name: Detect Metal toolchain / configure features
        working-directory: launcher
        run: |
          if ! xcrun metal --version > /dev/null 2>&1; then
            echo "::notice::No Metal toolchain on this runner: GPUI compiles its shaders at run time"
            echo "LAUNCHER_FEATURES=gpui/runtime_shaders" >> "$GITHUB_ENV"
          fi

      - name: Build horizon-launcher for x86_64
        working-directory: launcher
        run: |
          cargo build --release --locked --target x86_64-apple-darwin ${LAUNCHER_FEATURES:+--features "$LAUNCHER_FEATURES"}

      - name: Verify x86_64 binary
        working-directory: launcher
        run: |
          file target/x86_64-apple-darwin/release/horizon-launcher
          lipo -archs target/x86_64-apple-darwin/release/horizon-launcher | grep -w x86_64

      - name: Package Horizon.app (.app, .zip, .dmg)
        working-directory: launcher
        run: |
          rm -rf out && mkdir -p out
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          DMGBUILD="$RUNNER_TEMP/dmg/bin/dmgbuild" ../packaging/macos/package.sh target/x86_64-apple-darwin/release/horizon-launcher "$version" out x64
          # Also package Horizon.app bundle itself directly as a zip
          (cd out && ditto -c -k --norsrc --noextattr --noqtn --keepParent Horizon.app Horizon.app.zip)
          ls -la out

      - name: Upload Launcher App & Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-Launcher-macos-x86_64
          path: |
            launcher/out/Horizon.app.zip
            launcher/out/horizon-launcher-macos-x64.zip
            launcher/out/horizon-launcher-macos-x86_64.zip
            launcher/out/horizon-launcher-macos-x64.dmg
          if-no-files-found: error
          retention-days: 14

  build-game:
    name: Build Horizon Game Client (macOS x86_64)
    if: github.event_name != 'workflow_dispatch' || inputs.build_game == true
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: game-macos-x86_64

      - name: Build Client, Server, Prepare, and Ctl for x86_64
        run: |
          cargo build --release --locked --target x86_64-apple-darwin -p horizon-client --bin horizon-client --bin horizon-ctl -p horizon-prepare --bin horizon-prepare -p horizon-server --bin horizon-server

      - name: Verify binaries architecture
        run: |
          for b in horizon-client horizon-ctl horizon-prepare horizon-server; do
            echo "Checking $b:"
            file "target/x86_64-apple-darwin/release/$b"
            lipo -archs "target/x86_64-apple-darwin/release/$b" | grep -w x86_64
          done

      - name: Fetch precompiled exporters from upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p upstream_tmp
          gh release download nightly --repo horizon-rust/horizon --pattern "horizon-macos-arm64.zip" --dir upstream_tmp || \
          gh release download --repo horizon-rust/horizon --pattern "horizon-macos-arm64.zip" --dir upstream_tmp
          unzip -q upstream_tmp/horizon-macos-arm64.zip -d upstream_unpacked
          mkdir -p exporters
          cp -r upstream_unpacked/*/exporters/* exporters/
          ls -la exporters/

      - name: Package game directory with xtask
        run: |
          cargo run -p xtask -- package target/x86_64-apple-darwin/release/horizon-client dist/horizon-macos-x64
          (cd dist && ditto -c -k --norsrc --noextattr --noqtn --keepParent horizon-macos-x64 horizon-macos-x64.zip)
          cp dist/horizon-macos-x64.zip dist/horizon-macos-x86_64.zip
          ls -la dist/

      - name: Sign release archives
        run: |
          export RELEASE_SIGNING_KEY="MC4CAQAwBQYDK2VwBCIEIBYpgTjuwd0J5GXJuWAWOJQ+rzdExziIP0PQWAl3CKRt"
          bash tools/ci/sign_release.sh nightly dist/horizon-macos-x64.zip dist/horizon-macos-x86_64.zip
          cat dist/SHA256SUMS

      - name: Upload Game Client Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-Game-macos-x86_64
          path: |
            dist/horizon-macos-x64.zip
            dist/horizon-macos-x86_64.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish Nightly Release to CleanupFunction/horizon
    needs: [build-launcher, build-game]
    if: github.repository == 'CleanupFunction/horizon' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Launcher Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Horizon-Launcher-macos-x86_64
          path: release_assets/

      - name: Download Game Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Horizon-Game-macos-x86_64
          path: release_assets/

      - name: Re-sign all release assets together
        run: |
          # Sign all downloadable assets in release_assets for the nightly tag
          export RELEASE_SIGNING_KEY="MC4CAQAwBQYDK2VwBCIEIBYpgTjuwd0J5GXJuWAWOJQ+rzdExziIP0PQWAl3CKRt"
          files=()
          for f in release_assets/*.zip release_assets/*.dmg; do
            [ -f "$f" ] && files+=("$f")
          done
          bash tools/ci/sign_release.sh nightly "${files[@]}"
          cat release_assets/SHA256SUMS

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="nightly"
          title="Nightly $(date +%Y-%m-%d) · $(git rev-parse --short HEAD)"
          notes="Horizon macOS x86_64 release (Nightly). Contains playable game instances and launcher installer."

          echo "Publishing release $tag to CleanupFunction/horizon..."
          if gh release view "$tag" --repo CleanupFunction/horizon >/dev/null 2>&1; then
            gh release upload "$tag" release_assets/* --repo CleanupFunction/horizon --clobber
            gh release edit "$tag" --repo CleanupFunction/horizon --title "$title" --notes "$notes"
          else
            gh release create "$tag" release_assets/* --repo CleanupFunction/horizon --title "$title" --notes "$notes" --prerelease
          fi
          echo "Release successfully published!"
